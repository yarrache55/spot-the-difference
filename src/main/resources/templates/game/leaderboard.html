<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Classement — Spot the Difference</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&family=Kalam:wght@400;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/manga.css}"/>
</head>
<body class="menu-body">

<nav class="manga-nav">
    <div class="nav-logo"><span class="logo-eye">👁</span><span class="logo-text">SPOT!!</span></div>
    <div class="nav-links">
        <a th:href="@{/menu}" class="nav-link">MENU</a>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="nav-link nav-logout">QUITTER</button>
        </form>
    </div>
</nav>

<main class="leaderboard-main">
    <div class="leaderboard-header">
        <h1 class="manga-title">CLASSEMENT<br/><span class="title-accent">MONDIAL !!</span></h1>
        <div class="trophy">🏆</div>
    </div>

    <div class="leaderboard-table manga-panel">
        <div class="panel-corner tl"></div><div class="panel-corner tr"></div>
        <div class="panel-corner bl"></div><div class="panel-corner br"></div>

        <div class="lb-header-row">
            <span class="lb-col-rank">#</span>
            <span class="lb-col-name">MANGA-KA</span>
            <span class="lb-col-level">NIV.</span>
            <span class="lb-col-score">MEILLEUR SCORE</span>
        </div>

        <div th:if="${#lists.isEmpty(players)}" class="lb-empty">
            <p>Aucun joueur encore... Sois le premier !</p>
        </div>

        <div th:each="player, iter : ${players}" class="lb-row"
             th:classappend="${iter.index == 0 ? ' rank-gold' : (iter.index == 1 ? ' rank-silver' : (iter.index == 2 ? ' rank-bronze' : ''))}">
            <span class="lb-col-rank">
                <span th:if="${iter.index == 0}" class="rank-medal">🥇</span>
                <span th:if="${iter.index == 1}" class="rank-medal">🥈</span>
                <span th:if="${iter.index == 2}" class="rank-medal">🥉</span>
                <span th:if="${iter.index > 2}" th:text="${iter.index + 1}">4</span>
            </span>
            <span class="lb-col-name" th:text="${player.username}">Joueur</span>
            <span class="lb-col-level" th:text="${player.currentLevel}">1</span>
            <span class="lb-col-score" th:text="${player.bestScore}">0</span>
        </div>
    </div>

    <div style="text-align:center; margin-top: 2rem;">
        <a th:href="@{/menu}" class="manga-btn btn-primary">RETOUR AU MENU</a>
    </div>
</main>

<div class="speed-lines" aria-hidden="true">
    <div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div>
</div>

<script th:src="@{/js/manga.js}"></script>
</body>
</html>
