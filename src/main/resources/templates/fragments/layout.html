<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:replace="${title}">Spot the Difference</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&family=Kalam:wght@400;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/manga.css}"/>
    <th:block th:replace="${extraHead ?: ~{}}"></th:block>
</head>
<body>

<!-- NAV BAR -->
<nav class="manga-nav" th:if="${showNav != false}">
    <div class="nav-logo">
        <span class="logo-eye">👁</span>
        <span class="logo-text">SPOT!!</span>
    </div>
    <div class="nav-links">
        <a th:href="@{/menu}" class="nav-link">MENU</a>
        <a th:href="@{/leaderboard}" class="nav-link">SCORES</a>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="nav-link nav-logout">QUITTER</button>
        </form>
    </div>
</nav>

<!-- MAIN CONTENT -->
<main>
    <div th:replace="${content}">Content here</div>
</main>

<!-- SPEED LINES DECORATION -->
<div class="speed-lines" aria-hidden="true">
    <div class="line"></div><div class="line"></div><div class="line"></div>
    <div class="line"></div><div class="line"></div><div class="line"></div>
</div>

<script th:src="@{/js/manga.js}"></script>
<th:block th:replace="${extraScript ?: ~{}}"></th:block>
</body>
</html>
